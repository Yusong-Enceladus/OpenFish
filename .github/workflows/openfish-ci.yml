name: OpenFish CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: openfish-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-release:
    name: Privacy, dependencies, and Harness contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: npm install --global pnpm@11.7.0
      - run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - run: pnpm install --frozen-lockfile
      - run: pnpm run release:openfish:preflight
      - run: pnpm audit --prod
      - run: bash script/check_harness_contract.sh
