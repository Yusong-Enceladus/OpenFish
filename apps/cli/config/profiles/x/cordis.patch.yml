# OpenCodex product layer over the DSH Web composition. Every row is an ordinary
# Cordis plugin; DSH remains the sole runtime and state owner.
- id: webserver
  config:
    # OpenCodex is remotely reachable by default, unlike the ordinary Web
    # profile. The connection row below requires a paired bearer for every
    # non-loopback API/WebSocket request; an explicit --host 127.0.0.1 keeps a
    # deployment local-only.
    host: !!js ctx.webStartup.host ?? '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080

- id: connection
  config:
    trustedHosts: !!js ctx.webRuntime.trustedHosts
    requireAuthenticationForRemote: true

- insert:
    - id: voice
      name: '@deepseek-ai/dsh-voice'
    - id: voice-apple
      name: '@deepseek-ai/dsh-voice-apple'
      inject: [voice]
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
