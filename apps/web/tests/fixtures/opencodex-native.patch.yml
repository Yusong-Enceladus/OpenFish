# Hermetic OpenCodex product layer for the native behavior lane. The standard
# web scaffold remains the runtime; these are the same DSH-owned native and
# local-voice plugins composed by the shipped OpenCodex profile.
- insert:
    - id: voice
      name: '@deepseek-ai/dsh-voice'
    - id: voice-apple
      name: '@deepseek-ai/dsh-voice-apple'
      inject: [voice]
    - id: openfish-harnesses
      name: '@deepseek-ai/dsh-harness'
      config: {}
    - id: openfish-harness-controller
      name: '@deepseek-ai/dsh-api-harness-controller'
      inject: [typert, harnesses]
    - id: openfish-harness-acp
      name: '@deepseek-ai/dsh-harness-acp'
      inject: [harnesses, agents, sessions, subprocess, sandbox, sandboxPolicy, approval, userQuestions, credentials, attachments]
    - id: x-native
      name: '@deepseek-ai/dsh-bundle-x-native'
      inject: [webServer, connection, typert, typertGateway, sessionController, workspaceController]
      config:
        protocolVersion: v2
