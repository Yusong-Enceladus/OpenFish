name: OpenCodexIOS
options:
  bundleIdPrefix: app.openfish
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    exactVersion: 2.4.1
targets:
  OpenFishIOS:
    type: application
    platform: iOS
    sources:
      - Sources/XiOS
      - App
    dependencies:
      - package: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openfish.ios
        PRODUCT_NAME: OpenFish
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  OpenFishIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: OpenFishIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.openfish.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  OpenFishIOS:
    build:
      targets:
        OpenFishIOS: all
        OpenFishIOSUITests: [test]
    test:
      targets:
        - OpenFishIOSUITests
